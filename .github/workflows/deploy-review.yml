name: Publish catalog review
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'review-site/**'
      - '.github/workflows/deploy-review.yml'
permissions:
  contents: read
concurrency:
  group: parfumplace-catalog-review
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate standalone catalog
        run: python3 tools/check_review_export.py review-site
      - name: Install deployment key and verify server identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY" || { echo 'Missing DEPLOY_SSH_KEY repository secret'; exit 1; }
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/parfumplace_deploy"
          ssh-keygen -y -f "$HOME/.ssh/parfumplace_deploy" > /dev/null
          ssh-keyscan -T 15 -p 22 -t ed25519 212.113.99.234 > "$RUNNER_TEMP/host-key"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/host-key" -E sha256 | awk '{print $2}')" = 'SHA256:A3zj4MdiiGuCl2TK9enHX8q7QV7nQ/uL6W2pnNY+gZA'
          cp "$RUNNER_TEMP/host-key" "$HOME/.ssh/known_hosts"
      - name: Upload HTML over SFTP
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/upload.sftp" <<'SFTP'
          -mkdir /home/parfumplace/web/parfumplace.ru/public_html/catalog-review
          put review-site/*.html /home/parfumplace/web/parfumplace.ru/public_html/catalog-review/
          ls /home/parfumplace/web/parfumplace.ru/public_html/catalog-review/index.html
          SFTP
          sftp -P 22 -i "$HOME/.ssh/parfumplace_deploy" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -b "$RUNNER_TEMP/upload.sftp" parfumplace@212.113.99.234
      - name: Verify published catalog
        run: |
          python3 - <<'PY'
          import urllib.request
          for page in ['index.html', 'catalog-2.html', 'product-louis-vuitton-ombre-nomade.html']:
              url = 'https://parfumplace.ru/catalog-review/' + page
              with urllib.request.urlopen(url, timeout=30) as response:
                  body = response.read().decode('utf-8')
                  assert response.status == 200 and 'PARFUM PLACE' in body, url
              print('Verified:', url)
          PY
      - name: Remove private key
        if: always()
        run: rm -f "$HOME/.ssh/parfumplace_deploy"
