# Live MySQL catalog provisioned on Hestia; deploy the database-backed page.
name: Publish catalog review
run-name: Publish PHP catalog — ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      organize_photos:
        description: 'Run explicit photo migration and retired-folder cleanup'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'review-site/**'
      - 'resources/**'
      - 'bootstrap/**'
      - 'tools/build_single_php.py'
      - '.github/workflows/deploy-review.yml'
permissions:
  contents: read
concurrency:
  group: parfumplace-catalog-review
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: catalog-ci-only
          MARIADB_DATABASE: parfum_place_dev
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: parfum_place_dev
      DB_USER: root
      DB_PASSWORD: catalog-ci-only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Validate standalone catalog
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==12.0.0
          python3 -m unittest discover -s tests/Unit -p 'test_*.py' -v
          python3 tools/build_single_php.py
          php -l review-site/index.php
          php -r 'file_put_contents("/tmp/parfum-ci-database.php", "<?php return " . var_export(["host"=>"127.0.0.1","name"=>"parfum_place_dev","user"=>"root","password"=>getenv("DB_PASSWORD")], true) . ";");'
          php tools/import_mysql_catalog.php /tmp/parfum-ci-database.php
          python3 tests/Feature/single_php.py -v
      - name: Install deployment key and verify server identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY" || { echo 'Missing DEPLOY_SSH_KEY repository secret'; exit 1; }
          umask 077
          mkdir -p "$HOME/.ssh"
          python3 - <<'PYKEY'
          import os, pathlib, re
          value = os.environ['DEPLOY_SSH_KEY'].replace('\r', '').replace('\\n', '\n')
          match = re.search(r'-----BEGIN OPENSSH PRIVATE KEY-----.*?-----END OPENSSH PRIVATE KEY-----', value, re.S)
          if not match:
              raise SystemExit('::error::DEPLOY_SSH_KEY must contain the complete PRIVATE key, including BEGIN and END lines. Update this repository secret; do not paste the key into chat.')
          key = '\n'.join(line.strip() for line in match[0].splitlines()) + '\n'
          pathlib.Path(os.environ['HOME'], '.ssh', 'parfumplace_deploy').write_text(key)
          PYKEY
          if ! ssh-keygen -y -f "$HOME/.ssh/parfumplace_deploy" > /dev/null; then
            echo '::error::GitHub cannot read DEPLOY_SSH_KEY. Save the complete unencrypted private key from /root/parfumplace_deploy.'
            exit 1
          fi
          ssh-keyscan -T 15 -p 22 -t ed25519 212.113.99.234 > "$RUNNER_TEMP/host-key"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/host-key" -E sha256 | awk '{print $2}')" = 'SHA256:A3zj4MdiiGuCl2TK9enHX8q7QV7nQ/uL6W2pnNY+gZA'
          cp "$RUNNER_TEMP/host-key" "$HOME/.ssh/known_hosts"
      - name: Upload reviewed product photos before updating the page
        run: |
          python3 -m pip install --disable-pip-version-check paramiko==4.0.0
          python3 tools/upload_curated_photos.py "$HOME/.ssh/parfumplace_deploy" "$HOME/.ssh/known_hosts"
      - name: Upload single PHP file over SFTP
        shell: bash
        run: |
          set -euo pipefail
          # Fail before replacing the live page if database provisioning is incomplete.
          cat > "$RUNNER_TEMP/preflight.sftp" <<'PREFLIGHT'
          -mkdir /home/parfumplace/web/parfumplace.ru/private
          -rename /home/parfumplace/.config/parfumplace/database.php /home/parfumplace/web/parfumplace.ru/private/database.php
          chmod 600 /home/parfumplace/web/parfumplace.ru/private/database.php
          ls /home/parfumplace/web/parfumplace.ru/private/database.php
          PREFLIGHT
          sftp -P 22 -i "$HOME/.ssh/parfumplace_deploy" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -b "$RUNNER_TEMP/preflight.sftp" parfumplace@212.113.99.234
          printf -- '-rename /home/parfumplace/web/parfumplace.ru/public_html/index.html /home/parfumplace/web/parfumplace.ru/private/index-before-root-%s.html\n' "$GITHUB_RUN_ID" > "$RUNNER_TEMP/root-backup.sftp"
          sftp -P 22 -i "$HOME/.ssh/parfumplace_deploy" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -b "$RUNNER_TEMP/root-backup.sftp" parfumplace@212.113.99.234
          cat > "$RUNNER_TEMP/upload.sftp" <<'SFTP'
          put review-site/index.php /home/parfumplace/web/parfumplace.ru/public_html/index.php
          ls /home/parfumplace/web/parfumplace.ru/public_html/index.php
          SFTP
          sftp -P 22 -i "$HOME/.ssh/parfumplace_deploy" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -b "$RUNNER_TEMP/upload.sftp" parfumplace@212.113.99.234
      - name: Publish brand and fragrance routes
        run: |
          python3 -m pip install --disable-pip-version-check paramiko==4.0.0
          python3 tools/publish_product_routes.py "$HOME/.ssh/parfumplace_deploy" "$HOME/.ssh/known_hosts"
      - name: Verify published catalog
        run: |
          python3 - <<'PY'
          import urllib.request
          for page in ['', 'catalog.html', 'catalog.html?page=2', 'dior/sauvage.html', 'louis-vuitton/ombre-nomade.html', 'yves-saint-laurent/', 'about.html', 'delivery.html', 'payment.html', 'contacts.html']:
              url = 'https://parfumplace.ru/' + page
              with urllib.request.urlopen(url, timeout=30) as response:
                  body = response.read().decode('utf-8')
                  assert response.status == 200 and 'PARFUM PLACE' in body, url
              print('Verified:', url)
          PY
      - name: Reorganize matched photos into pict by database ID
        if: github.event_name == 'workflow_dispatch' && inputs.organize_photos
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/reorganize_images.py prepare "$RUNNER_TEMP/pict-migration"
          if ! sftp -P 22 -i "$HOME/.ssh/parfumplace_deploy" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -b "$RUNNER_TEMP/pict-migration/upload.sftp" parfumplace@212.113.99.234 > "$RUNNER_TEMP/pict-upload.log" 2>&1; then
            echo '::error::Photo upload failed; original images remain available. No source images were deleted.'
            exit 1
          fi
          python3 tools/reorganize_images.py verify "$RUNNER_TEMP/pict-migration"
      - name: Delete retired products_pictures after verified migration
        if: github.event_name == 'workflow_dispatch' && inputs.organize_photos
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check paramiko==4.0.0
          python3 tools/remove_old_pictures.py "$HOME/.ssh/parfumplace_deploy" "$HOME/.ssh/known_hosts" "$RUNNER_TEMP/pict-migration/manifest.json"
          python3 tools/reorganize_images.py verify "$RUNNER_TEMP/pict-migration"
          rm -rf "$RUNNER_TEMP/pict-migration"
      - name: Remove historical HTML exports after successful PHP verification
        shell: bash
        run: |
          set -euo pipefail
          git show 19413b2:review-site/index.html > /dev/null
          git ls-tree -r --name-only 19413b2 review-site/ | python3 -c 'import sys,re; names=[line.strip().split("/")[-1] for line in sys.stdin]; assert all(re.fullmatch(r"[a-z0-9-]+\.html",n) for n in names); print("\n".join("-rm /home/parfumplace/web/parfumplace.ru/public_html/catalog-review/"+n for n in names))' > "$RUNNER_TEMP/cleanup.sftp"
          printf -- '-rm /home/parfumplace/web/parfumplace.ru/public_html/catalog-review/index.php\n-rmdir /home/parfumplace/web/parfumplace.ru/public_html/catalog-review\n' >> "$RUNNER_TEMP/cleanup.sftp"
          sftp -P 22 -i "$HOME/.ssh/parfumplace_deploy" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -b "$RUNNER_TEMP/cleanup.sftp" parfumplace@212.113.99.234
      - name: Remove private key
        if: always()
        run: rm -f "$HOME/.ssh/parfumplace_deploy"
